<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Creator Radar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 65%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      margin-left: 5px;
    }

    button:active {
      transform: scale(0.97);
    }

    .creator {
      background: #1d1d1d;
      padding: 18px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .result {
      display: flex;
      gap: 15px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }

    .result:last-child {
      border-bottom: none;
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    a {
      color: #8ab4ff;
    }

    #message {
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🚀 Creator Radar</h1>
    <div class="subtitle">
      Track YouTube creators and discover new information.
    </div>

    <div>
      <input id="creatorInput" placeholder="Enter creator name">
      <button onclick="checkCreator()">Check Creator</button>
    </div>

    <div id="message"></div>
    <div id="results"></div>

  </div>

  <script>
    async function checkCreator() {
      const creator = document.getElementById("creatorInput").value.trim();
      const message = document.getElementById("message");
      const results = document.getElementById("results");

      if (!creator) {
        message.textContent = "Please enter a creator name.";
        return;
      }

      message.textContent = "🔎 Searching YouTube...";
      results.innerHTML = "";

      try {
        const response = await fetch(
  "https://bug-free-enigma-r7p9j9q46qp5h697-3000.app.github.dev/api/youtube?creator=" +
  encodeURIComponent(creator)
);

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "YouTube request failed");
        }

        message.textContent =
          "✅ YouTube results found for " + creator;

        if (!data.items || data.items.length === 0) {
          results.innerHTML = "<p>No YouTube channels found.</p>";
          return;
        }

        data.items.forEach(item => {
          const channel = item.snippet;

          results.innerHTML += `
            <div class="creator">
              <div class="result">
                <img src="${channel.thumbnails?.medium?.url || ""}">
                <div>
                  <h2>${channel.title}</h2>
                  <p>${channel.description || "No description available."}</p>
                  <a href="https://www.youtube.com/channel/${item.id.channelId}"
                     target="_blank">
                     Open YouTube Channel
                  </a>
                </div>
              </div>
            </div>
          `;
        });

      } catch (error) {
        message.textContent = "❌ Error: " + error.message;
      }
    }
  </script>

</body>
</html>
